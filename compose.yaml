name: ${COMPOSE_PROJECT_NAME:-laravel-back-ai-setup}

services:
  # ---------------------------------------------------------------------------
  # HTTP entrypoint. Serves public/ directly and proxies PHP to php-fpm.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_started
    networks:
      - app

  # ---------------------------------------------------------------------------
  # Application (php-fpm). Also the container you shell into for artisan,
  # composer and one-off php commands: make php
  # ---------------------------------------------------------------------------
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
      args:
        UID: ${WWWUSER:-1000}
        GID: ${WWWGROUP:-1000}
    image: ${COMPOSE_PROJECT_NAME:-laravel-back-ai-setup}/php:local
    restart: unless-stopped
    init: true
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - app

  # ---------------------------------------------------------------------------
  # Queue workers. Same image as php, different command.
  # ---------------------------------------------------------------------------
  horizon:
    image: ${COMPOSE_PROJECT_NAME:-laravel-back-ai-setup}/php:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
      args:
        UID: ${WWWUSER:-1000}
        GID: ${WWWGROUP:-1000}
    restart: unless-stopped
    init: true
    user: www-data
    command: ["php", "artisan", "horizon"]
    volumes:
      - .:/var/www/html
    # Horizon traps SIGTERM and finishes the job in flight before exiting.
    stop_signal: SIGTERM
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - app

  # ---------------------------------------------------------------------------
  # Scheduler. Same image as php again, running `schedule:work`: it stays in the
  # foreground and fires `schedule:run` at the top of every minute, which is the
  # container equivalent of the one crontab line Laravel asks for on a server.
  #
  # Each run is a fresh process, so code changes are picked up without a
  # restart -- unlike horizon, which holds the application in memory.
  #
  # What it currently runs is `model:prune` for LoginAttempt (routes/console.php).
  # ---------------------------------------------------------------------------
  scheduler:
    image: ${COMPOSE_PROJECT_NAME:-laravel-back-ai-setup}/php:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
      args:
        UID: ${WWWUSER:-1000}
        GID: ${WWWGROUP:-1000}
    restart: unless-stopped
    # schedule:work spawns a child per due task and does not reap it. Measured
    # here: 913 zombies in four days. php and horizon do not leak -- their
    # masters reap -- but they carry it too so dev matches the prod anchor.
    init: true
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www/html
    # schedule:work traps SIGTERM and lets a task that is mid-run finish.
    stop_signal: SIGTERM
    stop_grace_period: 30s
    healthcheck:
      # Proves the schedule is still firing, not merely that the process exists.
      # Same check as production -- see compose.prod.yaml.
      test: ["CMD-SHELL", "test -n \"$$(find /var/www/html/storage/framework/schedule-heartbeat -mmin -3 2>/dev/null)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - app

  # ---------------------------------------------------------------------------
  # Database. PostgreSQL 18 moved its VOLUME to /var/lib/postgresql and made
  # PGDATA version specific (/var/lib/postgresql/18/docker). Mounting the old
  # /var/lib/postgresql/data here would silently NOT persist anything.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    # 64 MB is Docker's default for /dev/shm; Postgres uses it for parallel
    # query and large hash joins. Matches compose.prod.yaml.
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laravel} -d ${DB_DATABASE:-laravel}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - app

  # ---------------------------------------------------------------------------
  # Test database. Separate server rather than a second database on `postgres`
  # so a `migrate:fresh` from the test suite can never touch your dev data.
  #
  # Storage is tmpfs (RAM): the data is disposable by definition, and skipping
  # the disk makes RefreshDatabase noticeably faster. Durability settings are
  # turned off for the same reason -- never copy this block to a real server.
  # ---------------------------------------------------------------------------
  postgres-test:
    image: postgres:18-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
    # Fixed values, matching phpunit.xml, and deliberately NOT derived from
    # DB_DATABASE/DB_USERNAME like the dev server above. phpunit's <env> entries
    # are literals -- it cannot read .env -- so those two have to agree, and
    # phpunit.xml is the one that cannot be parameterised. Deriving these from
    # .env instead means renaming a project (COMPOSE_PROJECT_NAME, DB_DATABASE)
    # leaves the whole suite connecting to a database that does not exist.
    # Nothing is lost: this server is tmpfs and its name carries no meaning.
    environment:
      POSTGRES_DB: laravel_testing
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "${FORWARD_TEST_DB_PORT:-5434}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d laravel_testing"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - app

  # ---------------------------------------------------------------------------
  # Queue backend. appendonly keeps queued jobs across a restart. The cache has
  # its own server below, matching production -- see compose.prod.yaml for why.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

  # ---------------------------------------------------------------------------
  # Cache backend. Split from the queue here too, so the arrangement the
  # application runs on in production is the one it is developed against.
  # No persistence: a cache that survives a restart buys nothing.
  # ---------------------------------------------------------------------------
  redis-cache:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  app:
    driver: bridge
