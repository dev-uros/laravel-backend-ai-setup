server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Resolved per request, as in prod.conf. A literal `fastcgi_pass php:9000`
    # is resolved once, when nginx starts -- and `make up` rebuilds and recreates
    # php, which can come back on another IP. nginx then keeps sending every
    # request to the old address and answers 502 until it is restarted. `make
    # setup` ends with exactly that `make up`, so a fresh project hit it on its
    # very first request.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location ~ \.php$ {
        set $upstream php:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
