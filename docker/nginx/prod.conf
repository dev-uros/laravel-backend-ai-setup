# The application's own nginx: serves public/ and speaks FastCGI to php-fpm.
# It is not the edge. TLS, domains and routing between services are Traefik's
# job, one layer out -- see compose.edge.yaml.
#
# Baked into the `web` image together with public/, so nothing here is editable
# on the server; a change means a rebuild.

server {
    listen 80;
    # The base image's 10-listen-on-ipv6-by-default.sh only patches this in when
    # the config is the one it shipped, and ours is not -- so without this line
    # nginx is IPv4 only, and anything resolving `localhost` to ::1 (a container
    # healthcheck included) gets connection refused.
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    # UpdateUserAvatarRequest caps an upload at 5 MB. Refusing an oversized body
    # here means it is never buffered through to PHP just to be rejected there.
    client_max_body_size 8m;

    # NO real_ip rewrite here, and that is deliberate -- resolving the caller's
    # address is Laravel's job (`trustProxies` in bootstrap/app.php), not this
    # layer's.
    #
    # Doing it here as well breaks the two of them against each other:
    # `set_real_ip_from 0.0.0.0/0` puts the caller's PUBLIC address into
    # REMOTE_ADDR, Laravel trusts only private ranges, so it stops believing
    # `X-Forwarded-Proto: https` and generates `http://` links on an https site.
    # Every Livewire call on /pulse is then blocked as mixed active content and
    # the dashboard sits in skeletons -- with nothing in any log to say why.
    #
    # Nothing here needs the address: there is no `limit_req` and no `limit_conn`
    # (rate limiting is Traefik's `api-ratelimit@file`), and the access log that
    # matters is the JSON line `LogRequests` writes, which reads the address from
    # Laravel -- which reads it from `X-Forwarded-For` once it trusts the proxy.

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        application/xml
        image/svg+xml
        text/css
        text/plain;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Avatars, served straight off the named volume through the public/storage
    # symlink. Immutable because the filename is a ULID: a replaced avatar
    # always gets a new name, so a cached copy can never go stale.
    location ^~ /storage/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Polled by the deploy script and by Docker every few seconds. Logging it
    # would be most of the access log and would tell you nothing.
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Docker's embedded DNS. Needed because the upstream below is written as a
    # variable, and that is deliberate: with a literal `fastcgi_pass php:9000`
    # nginx resolves the name once, at startup, and REFUSES TO START if the php
    # container is not up yet -- "host not found in upstream". One crashed
    # container then keeps the web server down with it, and a restart loop never
    # recovers on its own. As a variable the name is resolved per request, so
    # nginx boots regardless and starts serving the moment php is back.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location ~ \.php$ {
        set $upstream php:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
