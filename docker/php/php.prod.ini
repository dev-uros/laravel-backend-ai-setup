; Production overrides. Baked into the image -- there is no bind mount on the
; server, so changing this file means rebuilding and redeploying.

memory_limit = 256M
max_execution_time = 60

; UpdateUserAvatarRequest caps an upload at 5 MB. These are the walls behind
; that rule, and docker/nginx/prod.conf has a matching client_max_body_size, so
; an oversized body is refused at the edge instead of buffered through to PHP.
upload_max_filesize = 8M
post_max_size = 10M

expose_php = Off

; Errors go to the log, never to the response. APP_DEBUG=false already keeps
; Laravel quiet; this covers what fails before Laravel is running at all.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED
log_errors = On
error_log = /dev/stderr

; The single biggest difference from the development ini. Code inside a running
; container never changes -- a deploy replaces the image -- so stat()-ing every
; included file on every request buys nothing at all.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; JIT is deliberately off. It helps CPU-bound number crunching; a web request
; that spends its time in Postgres and Redis gains nothing measurable, and JIT
; bugs are hard to tell apart from application bugs.
opcache.jit = disable
opcache.jit_buffer_size = 0

realpath_cache_size = 4096k
realpath_cache_ttl = 600
