[www]
; The master process runs as root and the workers drop to this user -- the way
; php-fpm is built to work, and the reason the entrypoint deliberately does NOT
; drop privileges for `php-fpm` the way it does for every other command.
;
; Dropping them first looks tidier and breaks the container: the base image
; points error_log and slowlog at /proc/self/fd/2, only root can reopen the
; container's stderr, and fpm exits 78 with "failed to open error_log" on every
; single start.
user = www-data
group = www-data

listen = 9000

; Without this the workers see none of the container's environment and every
; env() call comes back null. config:cache in the entrypoint means Laravel
; would mostly survive it, which is exactly why it would go unnoticed until
; something outside config/ reached for env() directly.
clear_env = no

; Sized for a small VPS. The arithmetic: max_children x the real memory of one
; worker (this application sits around 60-90 MB under load, not the 256 MB
; memory_limit) has to leave room for Postgres, Redis and the queue workers.
; 12 x ~90 MB is a little over 1 GB. Raise it only with the memory to back it.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Recycle a worker after this many requests. Cheap insurance against a slow
; leak in any extension turning into an OOM three weeks into an uptime.
pm.max_requests = 500

; Anything slower than this gets a stack trace in the log, which is how you
; find the one query nobody indexed. It does not kill the request.
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2

; The php container's healthcheck opens a TCP connection to this port; nginx's
; healthcheck exercises the whole path through to Laravel. Between them a dead
; worker pool cannot go unnoticed.
ping.path = /ping
ping.response = pong

; Worker stdout/stderr goes to the container log, undecorated, which is what
; the Alloy scraper reads as JSON.
catch_workers_output = yes
decorate_workers_output = no

; nginx already logs every request, and LogRequests logs the ones that matter.
access.log = /dev/null
